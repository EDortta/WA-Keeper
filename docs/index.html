<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WA Keeper</title>
  <meta name="description" content="WA Keeper — arquivo pessoal das notificações do WhatsApp, no seu aparelho. O tipo de app que nunca passaria na Play Store.">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:      #0a0d0c;
      --surface: #101614;
      --border:  #1d2724;
      --muted:   #46564f;
      --text:    #b7c3bd;
      --bright:  #eef3f1;
      --accent:  #25d366;
      --blue:    #34b7f1;
      --red:     #f26161;
      --amber:   #e4b33a;
      --mono:    "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      --disp:    "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.62; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--blue); }

    .wrap { max-width: 908px; margin: 0 auto; padding: 0 24px; }

    nav { border-bottom: 1px solid var(--border); padding: 15px 0; position: sticky; top: 0; background: rgba(10,13,12,.9); backdrop-filter: blur(9px); z-index: 100; }
    nav .wrap { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; }
    .logo { font-family: var(--disp); font-size: 15px; font-weight: 700; color: var(--bright); letter-spacing: .02em; display: flex; align-items: center; gap: 9px; }
    .logo svg { width: 20px; height: 20px; }
    .badge { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--amber); border: 1px solid #3a3420; background: #16130a; padding: 3px 8px; border-radius: 4px; }
    .spacer { flex: 1; }
    .lang-switch { display: flex; gap: 4px; }
    .lang-btn { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; transition: color .12s, border-color .12s; }
    .lang-btn:hover { color: var(--text); border-color: var(--muted); }
    .lang-btn.active { color: var(--accent); border-color: var(--accent); }

    .hero { padding: 84px 0 66px; text-align: center; }
    .hero-art { margin: 0 auto 40px; max-width: 360px; }
    .hero-art svg { width: 100%; height: auto; display: block; }
    h1 { font-family: var(--disp); font-size: clamp(30px, 6vw, 52px); font-weight: 700; color: var(--bright); line-height: 1.08; letter-spacing: -.02em; margin-bottom: 20px; }
    h1 em { color: var(--accent); font-style: normal; }
    .subtitle { font-size: 17px; color: var(--text); max-width: 590px; margin: 0 auto 34px; line-height: 1.6; text-wrap: pretty; }
    .cta-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s, border-color .15s; }
    .btn svg { width: 16px; height: 16px; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #06120b; }
    .btn-primary:hover { color: #06120b; }
    .btn-ghost { border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { color: var(--bright); border-color: var(--muted); }

    section { padding: 62px 0; border-top: 1px solid var(--border); }
    h2 { font-family: var(--disp); font-size: 25px; font-weight: 700; color: var(--bright); margin-bottom: 22px; letter-spacing: -.01em; }
    h3 { font-family: var(--disp); font-size: 15px; font-weight: 600; color: var(--bright); margin-bottom: 7px; }
    p { margin-bottom: 14px; text-wrap: pretty; }
    p:last-child { margin-bottom: 0; }
    .lead { font-size: 16.5px; }

    .concept-quote { border-left: 3px solid var(--accent); padding: 12px 22px; margin: 26px 0; font-family: var(--disp); font-size: 19px; font-weight: 500; color: var(--bright); line-height: 1.4; }

    .vs-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 30px; }
    .vs-col { border: 1px solid var(--border); border-radius: 14px; padding: 22px; background: var(--surface); }
    .vs-col h4 { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 16px; }
    .vs-col.bad h4 { color: var(--red); }
    .vs-col.good h4 { color: var(--accent); }
    .vs-col ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .vs-col li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; }
    .vs-col li svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 2px; }

    .flow { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .flow-step { display: flex; gap: 18px; padding: 20px 0; border-bottom: 1px solid var(--border); }
    .flow-step:last-child { border-bottom: none; }
    .step-num { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); border: 1px solid var(--border); border-radius: 9px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-body { flex: 1; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .tag { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; }

    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 8px; }
    .card { border: 1px solid var(--border); border-radius: 14px; padding: 20px; background: var(--surface); }
    .card-icon { color: var(--accent); margin-bottom: 12px; display: block; }
    .card-icon svg { width: 22px; height: 22px; }
    .card p { font-size: 14px; color: var(--text); margin: 0; }

    table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 14.5px; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    td:first-child { font-family: var(--disp); color: var(--bright); font-weight: 500; width: 34%; }
    td:last-child { font-family: var(--mono); font-size: 13px; color: var(--text); }

    .warn { display: flex; gap: 12px; align-items: flex-start; border: 1px solid #3a3420; background: #14120b; border-radius: 12px; padding: 16px 18px; margin-top: 28px; }
    .warn svg { width: 20px; height: 20px; color: var(--amber); flex-shrink: 0; margin-top: 1px; }
    .warn p { font-size: 13.5px; color: #cbb98c; margin: 0; }

    footer { border-top: 1px solid var(--border); padding: 40px 0 56px; }
    footer .wrap { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .foot-txt { font-size: 13px; color: var(--muted); max-width: 560px; line-height: 1.5; }

    @media (max-width: 640px) {
      .vs-grid, .cards { grid-template-columns: minmax(0, 1fr); }
      td:first-child { width: 40%; }
      .badge { display: none; }
    }
  </style>
</head>

function setLang(lang) {
  const t = I18N[lang];
  if (!t) return;
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
  document.querySelectorAll('.lang-btn').forEach(function (btn) {
    btn.classList.toggle('active', btn.textContent.trim().toLowerCase() === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (key in t) el.textContent = t[key];
  });
  var tbody = document.getElementById('spec-tbody');
  tbody.innerHTML = '';
  t.spec_rows.forEach(function (row) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td');
    var td2 = document.createElement('td');
    td1.textContent = row[0];
    td2.textContent = row[1];
    tr.appendChild(td1);
    tr.appendChild(td2);
    tbody.appendChild(tr);
  });
}
