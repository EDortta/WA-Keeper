plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'br.com.wanotifkeeper'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.wanotifkeeper"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "1.0.8"
    }

    buildTypes {
        release {
            // SEC-0066: assinado com a chave de debug de propósito. Trocar de chave
            // exigiria desinstalar o app, e o banco de mensagens não tem como ser
            // restaurado depois (allowBackup=false + release não-debuggable). A chave
            // de debug é pública, então não protege contra quem já tem adb no
            // aparelho — mas fecha a brecha que importa aqui: com debuggable=false,
            // `run-as` não consegue mais extrair o banco.
            signingConfig signingConfigs.debug

            // SEC-0066: build de release não pode ser debuggable — APK debug
            // permite extrair o banco via `run-as` sem root. Uso diário deve
            // ser sempre com o APK release assinado (assinatura: pendência do
            // operador; keystore nunca deve ser commitado neste repo).
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testes unitários locais (JVM puro, sem instrumentação) — ver VoiceGateDecisionTest.
    testImplementation 'junit:junit:4.13.2'
}
