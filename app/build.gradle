plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'br.com.wanotifkeeper'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.wanotifkeeper"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0.9"
    }

    buildTypes {
        release {
            // SEC-0066: o APK instalado historicamente foi assinado com a debug.keystore
            // deste ambiente. Manter signingConfigs.debug aqui preserva compatibilidade
            // de atualização sem exigir desinstalação (o que apagaria o banco local).
            // Isto NÃO torna o APK debuggable: apenas reutiliza a mesma chave histórica.
            signingConfig signingConfigs.debug

            // Release continua não-debuggable; `run-as` permanece indisponível.
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Testes unitários locais (JVM puro, sem instrumentação) — ver
    // VoiceGateDecisionTest, MediaHintsTest, ScheduledMessageCoordinatorTest.
    testImplementation 'junit:junit:4.13.2'
}
