plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}


// WA Keeper feature-gated build. Source of truth: publisher/features.properties
def waFeatureRegistryFile = rootProject.file('publisher/features.properties')
if (!waFeatureRegistryFile.exists()) {
    throw new GradleException('Missing publisher/features.properties')
}
def waFeatureRegistry = new Properties()
waFeatureRegistryFile.withInputStream { waFeatureRegistry.load(it) }
def waKnownFeatures = waFeatureRegistry.getProperty('features', '').split(',').findAll { !it.isBlank() } as List
def waStoreBuild = (project.findProperty('waStore') ?: 'false').toString().toBoolean()
def waFeaturesPropertyPresent = project.hasProperty('waFeatures')
def waRequestedFeatures = [] as Set
if (waFeaturesPropertyPresent) {
    waRequestedFeatures.addAll(project.property('waFeatures').toString().split(',').findAll { !it.isBlank() })
} else {
    waKnownFeatures.each { f ->
        def key = waStoreBuild ? "feature.${f}.storeDefault" : "feature.${f}.labDefault"
        if (waFeatureRegistry.getProperty(key, 'false').toBoolean()) waRequestedFeatures.add(f)
    }
}
def waUnknownFeatures = waRequestedFeatures.findAll { !waKnownFeatures.contains(it) }
if (!waUnknownFeatures.isEmpty()) {
    throw new GradleException("Unknown WA Keeper feature(s): ${waUnknownFeatures.join(',')}")
}
if (waStoreBuild) {
    waRequestedFeatures.each { f ->
        if (!waFeatureRegistry.getProperty("feature.${f}.storeAllowed", 'false').toBoolean()) {
            throw new GradleException("STORE build cannot enable feature '${f}': storeAllowed=false")
        }
    }
}


// Secure release signing: secrets must never live in tracked files.
def releaseProps = new Properties()
def releasePropsFile = rootProject.file('release.properties')
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}
def signingValue = { String key ->
    def env = System.getenv(key)
    if (env != null && !env.isBlank()) return env
    return releaseProps.getProperty(key)
}

android {
    namespace 'br.com.wanotifkeeper'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.wanotifkeeper"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0.9"

        buildConfigField "boolean", "WA_STORE_BUILD", waStoreBuild.toString()
        waKnownFeatures.each { f ->
            def macro = "WA_FEATURE_" + f.toUpperCase().replaceAll("[^A-Z0-9]+", "_")
            buildConfigField "boolean", macro, waRequestedFeatures.contains(f).toString()
        }
    }

    signingConfigs {
        release {
            def storeFileValue = signingValue('RELEASE_STORE_FILE')
            def storePasswordValue = signingValue('RELEASE_STORE_PASSWORD')
            def keyAliasValue = signingValue('RELEASE_KEY_ALIAS')
            def keyPasswordValue = signingValue('RELEASE_KEY_PASSWORD')
            if (storeFileValue && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFileValue)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            def cfg = signingConfigs.release
            if (cfg.storeFile == null || cfg.storePassword == null || cfg.keyAlias == null || cfg.keyPassword == null) {
                throw new GradleException('Release signing not configured. Use untracked release.properties or RELEASE_* environment variables.')
            }
            signingConfig cfg
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ASR local/offline no próprio Android.
    implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8'

    // Testes unitários locais (JVM puro, sem instrumentação) — ver
    // VoiceGateDecisionTest, MediaHintsTest, ScheduledMessageCoordinatorTest.
    testImplementation 'junit:junit:4.13.2'
}
