<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goals Kit Watchdog | WA-Keeper</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light;--bg:#fff;--panel:#f5f6f8;--ink:#17212b;--soft:#667586;--line:#d7dce2;--accent:#2367a2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}body.dark{color-scheme:dark;--bg:#171b22;--panel:#232a34;--ink:#eaf0f7;--soft:#a5b3c3;--line:#424b58;--accent:#86bfff}button,select,textarea{font:inherit;color:inherit}button{border:1px solid var(--line);background:var(--bg);padding:7px 10px;border-radius:5px;cursor:pointer}button.active{border-color:var(--accent);background:var(--panel)}button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.muted{color:var(--soft)}header{padding:17px 20px;border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0}small{font-size:11px}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.space{flex:1}.graph{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}.nodes{display:flex;gap:0;min-width:650px;position:relative;padding:18px 0 8px}.nodes:before{content:"";position:absolute;top:33px;left:35px;right:35px;border-top:2px solid var(--soft);opacity:.5}.commit{position:relative;flex:1;text-align:center;border:0;background:transparent;padding:0;z-index:1;font-size:11px}.commit .dot{display:block;background:var(--bg);border:2px solid var(--soft);border-radius:100%;width:15px;height:15px;margin:7px auto}.commit.active .dot{background:var(--accent);border-color:var(--accent)}.commit .br{display:block;font-size:10px;color:var(--soft)}.graph-scroll{overflow-x:auto}.nav{margin-top:14px}.main{min-height:380px}.map-toolbar{padding:12px 15px}.map-scroll{width:100%;overflow-x:auto}table{border-collapse:separate;border-spacing:0;table-layout:fixed;width:max-content;min-width:100%;font-size:12px}th,td{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);overflow-wrap:anywhere}th{background:var(--panel)}.frozen{position:sticky;left:0;z-index:2;background:var(--bg);box-shadow:3px 0 5px #0002}th.frozen{z-index:3;background:var(--panel)}.colhead{display:flex;justify-content:space-between;align-items:center;gap:6px}.colhead button{padding:1px 5px;border:0;color:var(--soft)}.resize{width:7px;height:22px;border-right:2px solid var(--line);cursor:col-resize;touch-action:none}.domain-link{background:none;border:0;color:var(--accent);font-weight:700;padding:0;text-align:left}.picker{display:flex;flex-wrap:wrap;gap:12px;background:var(--panel);padding:12px;margin:0 14px 12px;border:1px solid var(--line)}.manage{display:grid;grid-template-columns:220px minmax(0,1fr)}aside{border-right:1px solid var(--line);padding:13px}aside button.item{display:block;width:100%;margin:6px 0;text-align:left}aside button.future{opacity:.42}article{padding:16px;min-width:0}.tabs{border-bottom:1px solid var(--line);padding-bottom:10px;margin:14px 0}.tree{border:1px solid var(--line);padding:12px;border-radius:5px}details{margin:7px 0 7px 12px}summary{cursor:pointer}.editor{width:100%;min-height:240px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:4px;font-family:monospace;font-size:12px}footer{border-top:1px solid var(--line);padding:10px 15px;font-size:11px;color:var(--soft)}@media(max-width:580px){.manage{grid-template-columns:135px minmax(0,1fr)}article,aside{padding:8px}}
</style></head><body><header><div class="toolbar"><div><h1>WA-Keeper</h1><div class="muted">Captura, organização e preservação de conversas</div></div><span class="space"></span><button id="theme">Light / Dark</button></div><div class="graph"><div class="toolbar"><strong>Grafo de commits</strong><span class="space"></span><small class="muted" id="revision"></small></div><div class="graph-scroll"><div class="nodes" id="nodes"></div></div></div><div class="toolbar nav"><button id="home">⌂ Mapa</button><button id="features">Features</button><button id="domains">Domínios</button><span class="space"></span><small class="muted" id="view-label"></small></div></header><main class="main"><section id="map"><div class="toolbar map-toolbar"><strong>Mapa geral de domínios</strong><span class="space"></span><button id="columns">Colunas</button><button id="reset">Restaurar</button></div><div id="picker" class="picker" hidden></div><div class="map-scroll"><table id="grid"></table></div></section><section id="manage" class="manage" hidden><aside><div class="toolbar"><button id="side-features">Features</button><button id="side-domains">Domínios</button></div><div id="list"></div></aside><article><div class="toolbar"><h2 id="title" style="font-size:19px;margin:0"></h2><span class="space"></span><small id="status" class="muted"></small></div><p class="muted" id="description"></p><div class="toolbar tabs" id="tabs"><button data-tab="description">Descrição</button><button data-tab="events">Eventos</button><button data-tab="code">Código</button><button data-tab="tests">Testes</button></div><div id="content"></div></article></section></main><footer>Protótipo local · Dados demonstrativos · Nenhuma gravação no repositório ou no histórico Git</footer>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const commits=[['C1','main','2026-08-02'],['C2','development','2026-08-19'],['C3','development','2026-09-03'],['F1','feature/audio','2026-09-12'],['M1','development','2026-09-22'],['C5','development','2026-10-02'],['HEAD','development','2026-10-08']];
const cols=[['domain','Domínio',165],['purpose','Propósito',220],['owns','É dono de',210],['excludes','Não pode tocar',210],['inputs','Entradas',180],['outputs','Saídas / Eventos',220],['invariants','Invariantes',230],['status','Estado',130]].map(([id,name,width])=>({id,name,width,visible:true}));
const domains=[
{domain:'Captura',purpose:'Receber e preservar notificações.',owns:'Recepção e filtragem.',excludes:'Identidade de conversa.',inputs:'Notificações Android',outputs:'notification_captured',invariants:'Evento capturado não pode ser perdido silenciosamente.',status:'Implementado',born:1},
{domain:'Identidade',purpose:'Resolver contatos e conversas.',owns:'Desambiguação e associação.',excludes:'Envio efetivo.',inputs:'Títulos, contatos, números',outputs:'conversation_resolved',invariants:'Não misturar mensagens de conversas diferentes.',status:'Em revisão',born:2},
{domain:'Áudio',purpose:'Capturar, reproduzir, transcrever.',owns:'Mídia e transcrição.',excludes:'Identidade do remetente.',inputs:'Arquivo de áudio',outputs:'audio_captured, transcription_completed',invariants:'Histórico e controles preservados.',status:'Implementado',born:3},
{domain:'Agendamento',purpose:'Programar e recuperar mensagens.',owns:'Fila e tentativas.',excludes:'Cadastro de contatos.',inputs:'Destinatário, conteúdo, horário',outputs:'message_scheduled, message_sent',invariants:'Fila persistente e envio sequencial.',status:'Em revisão',born:4},
{domain:'Backup',purpose:'Preservar e restaurar dados.',owns:'Cópias e validação.',excludes:'Regra de conversas.',inputs:'Banco e arquivos',outputs:'backup_created',invariants:'Não apagar origem antes de verificar.',status:'Implementado',born:5}];
const features=[{name:'Transcrição offline',purpose:'Whisper Base INT8.',born:3,status:'Protegida',outputs:'transcription_completed'},{name:'Mensagens agendadas',purpose:'Fila e envio sequencial.',born:4,status:'Protegida',outputs:'message_sent'},{name:'Backup Google Drive',purpose:'Cópia remota.',born:5,status:'Em validação',outputs:'backup_created'}];
const state={view:'map',commit:6,selected:'Identidade',tab:'description',editing:false,markdown:{}};function list(){return state.view==='domains'?domains.map(d=>({...d,name:d.domain})):features}
function navigate(view,name){state.view=view;state.tab='description';state.editing=false;if(name)state.selected=name;else if(view!=='map'&&!list().find(x=>x.name===state.selected))state.selected=list()[0].name;render()}
function render(){ $('map').hidden=state.view!=='map';$('manage').hidden=state.view==='map';for(const id of ['home','features','domains'])$(id).classList.toggle('active',(id==='home'?'map':id)===state.view);$('view-label').textContent=state.view==='map'?'Mapa geral':state.view==='domains'?'Gestão de domínios':'Gestão de features';$('revision').textContent=commits[state.commit].join(' · ');$('nodes').innerHTML=commits.map((c,i)=>'<button class="commit '+(i===state.commit?'active':'')+'" data-commit="'+i+'" title="'+esc(c.join(' · '))+'"><span>'+esc(c[0])+'</span><span class="dot"></span><span class="br">'+esc(c[1])+'</span><span class="br">'+esc(c[2])+'</span></button>').join('');document.querySelectorAll('[data-commit]').forEach(b=>b.onclick=()=>{state.commit=+b.dataset.commit;render()});renderMap();if(state.view!=='map')renderManage()}
function renderMap(){let v=cols.filter(c=>c.visible);$('grid').innerHTML='<colgroup>'+v.map(c=>'<col style="width:'+c.width+'px">').join('')+'</colgroup><thead><tr>'+v.map(c=>'<th class="'+(c.id==='domain'?'frozen':'')+'"><div class="colhead">'+esc(c.name)+'<span style="display:flex">'+(c.id==='domain'?'':'<button title="Ocultar coluna" data-hide="'+c.id+'">−</button>')+'<span title="Redimensionar coluna" class="resize" data-resize="'+c.id+'"></span></span></div></th>').join('')+'</tr></thead><tbody>'+domains.map(d=>'<tr style="'+(d.born>state.commit?'opacity:.4':'')+'">'+v.map(c=>'<td class="'+(c.id==='domain'?'frozen':'')+'">'+(c.id==='domain'?'<button class="domain-link" data-domain="'+esc(d.domain)+'">'+esc(d.domain)+'</button>':esc(d.born>state.commit?'—':d[c.id]))+'</td>').join('')+'</tr>').join('')+'</tbody>';$('picker').innerHTML=cols.map(c=>'<label><input type="checkbox" data-toggle="'+c.id+'" '+(c.visible?'checked':'')+' '+(c.id==='domain'?'disabled':'')+'> '+esc(c.name)+'</label>').join('');document.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>navigate('domains',b.dataset.domain));document.querySelectorAll('[data-hide]').forEach(b=>b.onclick=()=>{cols.find(c=>c.id===b.dataset.hide).visible=false;renderMap()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onchange=()=>{cols.find(c=>c.id===b.dataset.toggle).visible=b.checked;renderMap()});document.querySelectorAll('[data-resize]').forEach(el=>el.onpointerdown=e=>{e.preventDefault();const c=cols.find(c=>c.id===el.dataset.resize),start=e.clientX,old=c.width;const move=ev=>{c.width=Math.max(80,Math.min(520,old+ev.clientX-start));const col=[...$('grid').querySelectorAll('col')][cols.filter(x=>x.visible).findIndex(x=>x.id===c.id)];if(col)col.style.width=c.width+'px'};const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)}})}
function renderManage(){const arr=list();if(!arr.some(x=>x.name===state.selected))state.selected=arr[0].name;const d=arr.find(x=>x.name===state.selected),future=d.born>state.commit;$('list').innerHTML=arr.map(a=>'<button class="item '+(a.name===state.selected?'active ':'')+(a.born>state.commit?'future':'')+'" data-item="'+esc(a.name)+'"><strong>'+esc(a.name)+'</strong><br><small class="muted">'+esc(a.purpose)+'</small></button>').join('');document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.item;state.tab='description';renderManage()});$('side-features').classList.toggle('active',state.view==='features');$('side-domains').classList.toggle('active',state.view==='domains');$('title').textContent=d.name;$('description').textContent=d.purpose;$('status').textContent=future?'Ainda não existia':d.status;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(future){$('content').innerHTML='<p class="muted">Este item não existia no commit selecionado.</p>';return}if(state.tab==='description'){const key=state.view+':'+d.name,md=state.markdown[key]||'# '+d.name+'\n\n## Propósito\n'+d.purpose+'\n\n## Responsabilidades\n### É dono de\n'+(d.owns||'Comportamento próprio')+'\n### Não pode tocar\n'+(d.excludes||'Outros domínios')+'\n\n## Invariantes\n'+(d.invariants||'Preservar contrato aprovado');$('content').innerHTML='<div class="toolbar" style="margin:12px 0"><span class="muted">Markdown hierárquico</span><span class="space"></span><button id="edit">'+(state.editing?'Fechar edição':'Editar')+'</button></div>'+(state.editing?'<textarea id="markdown" class="editor" aria-label="Markdown"></textarea><p class="muted">Rascunho somente em memória. Não grava no Git.</p>':'<div class="tree">'+md.split('\n').filter(x=>x.trim()).map(x=>x.startsWith('### ')?'<details><summary>'+esc(x.slice(4))+'</summary></details>':x.startsWith('## ')?'<details open><summary><strong>'+esc(x.slice(3))+'</strong></summary></details>':x.startsWith('# ')?'<strong>'+esc(x.slice(2))+'</strong>':'<p>'+esc(x)+'</p>').join('')+'</div>');if(state.editing)$('markdown').value=md;$('edit').onclick=()=>{if(state.editing)state.markdown[key]=$('markdown').value;state.editing=!state.editing;renderManage()}}else if(state.tab==='events')$('content').innerHTML='<div class="tree"><strong>Entradas</strong><p>'+esc(d.inputs||'Eventos externos')+'</p><strong>Saídas</strong><p><code>'+esc(d.outputs||'—')+'</code></p></div>';else if(state.tab==='code')$('content').innerHTML='<p class="muted">Futura busca de símbolos e referências no código do commit selecionado. Nenhuma ocorrência verificada neste protótipo.</p>';else $('content').innerHTML='<p class="muted">Nenhum teste foi executado neste protótipo.</p>'}
$('home').onclick=()=>navigate('map');$('features').onclick=()=>navigate('features');$('domains').onclick=()=>navigate('domains');$('side-features').onclick=()=>navigate('features');$('side-domains').onclick=()=>navigate('domains');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.editing=false;renderManage()});$('columns').onclick=()=>{$('picker').hidden=!$('picker').hidden};$('reset').onclick=()=>{cols.forEach(c=>c.visible=true);renderMap()};$('theme').onclick=()=>document.body.classList.toggle('dark');render();
</script></body></html>
