<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goals Kit Watchdog</title><link rel="stylesheet" href="style.css"></head><body><header><div class="row"><div><h1 id="project">WA-Keeper</h1><div class="muted" id="subtitle">Goals Kit Watchdog · Repositório local</div></div><span class="grow"></span><button id="theme">Light / Dark</button></div><div class="row spacing"><strong>Grafo de commits</strong><span class="grow"></span><span id="selected-rev" class="muted"></span></div><div class="scroll"><svg id="graph" role="img" aria-label="Histórico de commits e branches"></svg></div><div class="row spacing"><button id="home">⌂ Mapa</button><button id="features">Features</button><button id="domains">Domínios</button><span class="grow"></span><span id="view-name" class="muted"></span></div></header><main><section id="map"><div class="row panel"><strong>Mapa geral de domínios</strong><span class="grow"></span><button id="columns">Colunas</button><button id="reset">Restaurar</button></div><div id="picker" class="picker" hidden></div><div class="scroll"><table id="grid"></table></div></section><section id="management" class="management" hidden><aside><div class="row"><button id="side-features">Features</button><button id="side-domains">Domínios</button></div><div id="items"></div></aside><article><div class="row"><h2 id="item-title"></h2><span class="grow"></span><span class="muted" id="item-state"></span></div><p class="muted" id="item-description"></p><div class="row tabs"><button data-tab="description">Descrição</button><button data-tab="events">Eventos</button><button data-tab="code">Código</button><button data-tab="tests">Testes</button></div><div id="detail"></div></article></section></main><footer id="notice">Modo observação · somente leitura · nenhuma alteração no Git</footer><script src="app.js"></script></body></html>
