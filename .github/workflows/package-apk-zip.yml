name: Build and publish APK ZIP

# IMPORTANT:
# Production/test-device APKs must be built on devel3 because the currently
# installed WA Keeper uses that machine's historical ~/.android/debug.keystore.
# GitHub-hosted runners generate a different debug key, so their APK cannot
# update the installed app without data loss.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify sources only
        run: ./gradlew test assembleDebug

      - name: Explain publishing path
        run: |
          echo "APK publishing is intentionally done on devel3:"
          echo "  bash scripts/build-devel3.sh"
